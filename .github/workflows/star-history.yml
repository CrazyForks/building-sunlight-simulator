name: Star History

on:
  schedule:
    - cron: "17 */6 * * *"
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  refresh-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Render star history
        uses: narayann7/star-history-action@c2061675dacbf6f35d116e556015b8905843387f # v1
        with:
          repos: ${{ github.repository }}
          output-dir: assets/star-history
          update-readme: "false"
